[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "api"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

[features]
# Compiled in for `cargo build` / `cargo run` (no feature flags) and the
# default `cargo test`. Disabled in `--features lambda` production builds.
# Gates the dev-login endpoint and `LOCAL_AUTH_ISSUER` env-var handling.
dev_auth = ["dep:dotenvy"]
default = ["dev_auth"]
lambda = ["dep:lambda_http", "dep:lambda_runtime"]

[dependencies]
domain.workspace = true
fwc26.workspace = true
storage.workspace = true
mail.workspace = true
sportsdb = { path = "../sportsdb" }
async-trait.workspace = true
anyhow.workspace = true
tokio.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = "0.8"
async-graphql = { version = "7", features = ["chrono"] }
async-graphql-axum = "7"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
lambda_http = { version = "0.13", optional = true }
lambda_runtime = { version = "0.13", optional = true }
dotenvy = { version = "0.15", optional = true }

[dev-dependencies]
mail.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
