<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="256" height="256">
  <!-- xPool logo candidate 01 — pitch + purple direction.
       Disc = soccer pitch (top-down) with mowed-grass stripes.
       White chunky X = the brand mark, dominant.
       Purple center spot at the X intersection = kickoff dot, the accent. -->
  <defs>
    <clipPath id="disc-clip">
      <circle cx="24" cy="24" r="22"/>
    </clipPath>
  </defs>

  <!-- Pitch base -->
  <circle cx="24" cy="24" r="22" fill="#0c7a36"/>

  <!-- Mowed-grass stripes (horizontal bands, low contrast) -->
  <g clip-path="url(#disc-clip)" opacity="0.55">
    <rect x="0" y="4"  width="48" height="8" fill="#15a04a"/>
    <rect x="0" y="20" width="48" height="8" fill="#15a04a"/>
    <rect x="0" y="36" width="48" height="8" fill="#15a04a"/>
  </g>

  <!-- Pitch rim (slight definition without a heavy stroke) -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="#075020" stroke-width="0.8"/>

  <!-- Chunky white X — rounded line caps for a friendlier feel than sharp -->
  <g stroke="#fff" stroke-width="7" stroke-linecap="round">
    <line x1="13" y1="13" x2="35" y2="35"/>
    <line x1="35" y1="13" x2="13" y2="35"/>
  </g>

  <!-- Purple kickoff dot at the X intersection — the brand accent. -->
  <circle cx="24" cy="24" r="2.2" fill="#7e14ff"/>
</svg>
