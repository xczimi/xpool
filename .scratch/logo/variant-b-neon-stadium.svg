<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="256" height="256">
  <!-- Variant B — NEON STADIUM.
       Reference: Monday Night Football '85 intro / OutRun (Sega '86) / Miami Vice.
       Synthwave sunset sky, neon double-stroke X (pink + cyan), CRT scanlines.
       Implied app language: gradient backgrounds, neon glow buttons, VT323 font,
       subtle scanline overlay on cards. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a0833"/>
      <stop offset="40%"  stop-color="#bd1a87"/>
      <stop offset="70%"  stop-color="#ff4d8a"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <clipPath id="disc-b"><circle cx="24" cy="24" r="22"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- sunset sky disc -->
  <circle cx="24" cy="24" r="22" fill="url(#sky)"/>

  <!-- horizon line across the disc (suggests stadium silhouette) -->
  <line x1="2" y1="29" x2="46" y2="29" stroke="#21d4fd" stroke-width="0.5" opacity="0.7" clip-path="url(#disc-b)"/>

  <!-- subtle CRT scanlines -->
  <g clip-path="url(#disc-b)" opacity="0.18" fill="#000">
    <rect x="0" y="3"  width="48" height="1"/>
    <rect x="0" y="7"  width="48" height="1"/>
    <rect x="0" y="11" width="48" height="1"/>
    <rect x="0" y="15" width="48" height="1"/>
    <rect x="0" y="19" width="48" height="1"/>
    <rect x="0" y="23" width="48" height="1"/>
    <rect x="0" y="27" width="48" height="1"/>
    <rect x="0" y="31" width="48" height="1"/>
    <rect x="0" y="35" width="48" height="1"/>
    <rect x="0" y="39" width="48" height="1"/>
    <rect x="0" y="43" width="48" height="1"/>
  </g>

  <!-- cyan rim glow -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="#21d4fd" stroke-width="0.8" filter="url(#glow)"/>

  <!-- X with neon triple-stroke: pink halo / cyan inner / white core -->
  <g stroke-linecap="round" fill="none">
    <line x1="13" y1="13" x2="35" y2="35" stroke="#ff2882" stroke-width="10" opacity="0.9"/>
    <line x1="35" y1="13" x2="13" y2="35" stroke="#ff2882" stroke-width="10" opacity="0.9"/>
    <line x1="13" y1="13" x2="35" y2="35" stroke="#21d4fd" stroke-width="5.5"/>
    <line x1="35" y1="13" x2="13" y2="35" stroke="#21d4fd" stroke-width="5.5"/>
    <line x1="13" y1="13" x2="35" y2="35" stroke="#fff" stroke-width="2"/>
    <line x1="35" y1="13" x2="13" y2="35" stroke="#fff" stroke-width="2"/>
  </g>
</svg>
